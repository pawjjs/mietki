openapi: 3.0.3
info:
  title: Ciezka Jazda API
  version: 1.0.0
  description: API for the Ciezka Jazda racing game.
servers:
  - url: http://localhost:3000
paths:
  /api/rooms:
    post:
      summary: Create a room
      operationId: createRoom
      tags:
        - Rooms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
            example:
              name: Evening race
              maxPlayers: 4
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    CreateRoomRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 16
          default: 4
    Room:
      type: object
      required:
        - id
        - name
        - maxPlayers
        - mapId
        - players
        - status
      properties:
        id:
          type: string
        ownerId:
          type: string
          nullable: true
        name:
          type: string
        maxPlayers:
          type: integer
        mapId:
          type: string
          nullable: true
        players:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - waiting
            - started
    Error:
      type: object
      properties:
        error:
          type: string
          example: Invalid request body
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: maxPlayers
              message:
                type: string
                example: 'Too small: expected number to be >=2'
